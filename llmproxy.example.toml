listen_addr = "127.0.0.1:8080"
routing_mode = "integrated" # proxy | intercept | integrated
# Optional auto-mapped model. When omitted, the first model returned by the
# default provider's /v1/models is used.
# default_model = "gpt-5.5"
# Timestamped trace logs are written under ~/.llmproxy. Set 0 to retain them indefinitely.
max_logging_retention_days = 7

# Optional loopback-only admin web interface (monitoring + runtime config
# editing). Disabled unless enable = true. Omitting listen_address binds
# 127.0.0.1 with a random port, printed at startup. The UI is served from the
# ui/ directory next to the binary: debug builds re-read files per request,
# release builds read them once at startup and cache until restart.
# Requests are accepted when the Host header port matches the bound port and
# the host resolves to a loopback address, so http://localhost:PORT works as
# well as the literal IP. Names are admitted by resolution, never by spelling:
# an attacker-chosen hostname still fails, which is what keeps DNS rebinding
# closed on this unauthenticated interface. A machine name published at
# 127.0.1.1 (the Debian-style /etc/hosts entry) counts as loopback and is
# allowed. Reaching the admin from a non-loopback address is not supported;
# use an SSH tunnel or a reverse proxy that rewrites Host to the loopback name.
[admin]
enable = false
# listen_address = "127.0.0.1:11180"

[providers.default]
kind = "openai-compatible"
base_url = "http://127.0.0.1:8000/v1"
# api_key_env = "VLLM_API_KEY"
# Force the outbound value after routing. "high" is the portable choice;
# use "max" only when every model routed here supports it.
# reasoning_effort = "high"
timeout_secs = 600
connect_timeout_secs = 10
pool_max_idle_per_host = 64
pool_idle_timeout_secs = 90
# Providers to try when this one is unavailable, in order. Each entry is a
# provider name, or provider/model to switch model as well. Fallbacks are not
# followed recursively, so one hop cannot cascade into a chain of timeouts.
# Failover only happens for availability failures (connect, timeout, 408, 429,
# 502, 503, 504) and only before any bytes reach the caller, so a request that
# may already have been generated is never silently sent twice.
# fallback = ["triage/local-fast"]
# Consecutive availability failures that stop this provider from being tried at
# all, and how long it stays skipped before one probe is allowed through.
# Set the threshold to 0 to disable the breaker.
circuit_breaker_threshold = 5
circuit_breaker_cooldown_secs = 30

# Optional agent interceptor. The triage provider receives a dynamic
# Chat Completions copy of /chat/completions, /responses, or /messages requests.
# It directly completes deterministic work above the built-in 80% likelihood
# threshold; a sole PASS function call sends the untouched original request
# through the existing provider/model remapping.
[providers.triage]
kind = "openai-compatible"
base_url = "http://127.0.0.1:11434/v1"
# api_key_env = "LOCAL_LLM_API_KEY"
timeout_secs = 30
connect_timeout_secs = 2
pool_max_idle_per_host = 16
pool_idle_timeout_secs = 90

[interceptor]
provider = "triage"
model = "qwen3:4b"
timeout_ms = 60000
fallback_on_error = true
# Optional fail-closed screening before provider execution or routing. The
# triage provider must be loopback/private-network because it sees the prompt
# before deciding REJECT at the built-in 75% likelihood threshold.
# The safe REJECT response never repeats the detected value. Proxy mode remains
# prompt-free and ignores this setting until the instance uses a triage mode.
reject_sensitive = false
# Sampling for the triage request. Completions that hit max_tokens fall back to
# normal provider routing instead of serving a clipped answer; max_tokens = 0
# leaves the client's own limits in place.
# temperature = 0.0
# max_tokens = 512
# parallel_tool_calls = false
# instructions = """Override the default triage instructions here."""
# Launchers inherit the one instance routing_mode:
# llmproxy --config llmproxy.example.toml --codex
# llmproxy --config llmproxy.example.toml --claude
# llmproxy --config llmproxy.example.toml --copilot

# Provider kinds select the upstream wire protocol and authentication shape.
# Cross-provider routes require an explicit proxy-owned API credential, OR a
# borrowed CLI login via auth = "codex-oauth"/"claude-oauth" (see below). These
# examples stay commented so this file starts without contacting remote APIs.
# [providers.openai]
# kind = "openai"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# reasoning_effort = "high"
#
# [providers.anthropic]
# kind = "anthropic"
# base_url = "https://api.anthropic.com/v1"
# api_key_env = "ANTHROPIC_API_KEY"
# reasoning_effort = "high"
#
# [providers.copilot]
# kind = "copilot"
# base_url = "https://api.githubcopilot.com"
# api_key_env = "COPILOT_BACKEND_TOKEN"

# Borrowed subscription OAuth: instead of a proxy-owned API key, reuse the login
# the official CLI already wrote to disk. llmproxy reads the token, refreshes it
# against the vendor endpoint when near expiry, and writes the rotated token back
# so the CLI keeps working. No key, no per-token billing — it uses your plan.
#
# codex-oauth borrows ~/.codex/auth.json (run `codex login` first) and speaks the
# ChatGPT Codex Responses backend; base_url MUST be the Codex backend, not
# api.openai.com. claude-oauth borrows ~/.claude/.credentials.json and presents
# requests as Claude Code so the subscription token is accepted.
# [providers.codex_sub]
# kind = "openai"
# auth = "codex-oauth"
# base_url = "https://chatgpt.com/backend-api/codex"
# reasoning_effort = "high"
#
# [providers.claude_sub]
# kind = "anthropic"
# auth = "claude-oauth"
# base_url = "https://api.anthropic.com/v1"
# reasoning_effort = "high"

# Integrated mode routes model "Auto" through the target tools below. Any other
# model bypasses integrated triage. Unmatched model IDs stay unchanged on the
# default provider. Redirects are sticky per hashed conversation key for the
# configured TTL; no message or session text is kept.
[integrated]
sticky_ttl_secs = 1800
sticky_capacity = 1024
# instructions = """Override the integrated routing policy here; empty uses the built-in default."""
#
[integrated.targets.DETERMINISTIC]
provider = "default"
model = "Qwen/Qwen2.5-Coder-32B-Instruct"
hint = "routine deterministic execution when confidence is greater than 80%"

# [integrated.targets.backend]
# provider = "openai"
# model = "gpt-5.4"
# reasoning_effort = "max" # overrides the provider default for this target
# hint = "server-side and backend work, deep exploration and debugging, and everything else not claimed by another route (default route)"
#
# [integrated.targets.frontend]
# provider = "anthropic"
# model = "claude-sonnet-4-5"
# hint = "GUI and frontend work: interface design, visual investigation, and UI implementation"
#
# [integrated.targets.routine]
# provider = "copilot"
# model = "gpt-5.4"
# hint = "routine work assigned to the Copilot provider"

# Optional manual overrides. Without these, every incoming model is mapped to
# the first id returned by the default upstream /v1/models. Inline route tables
# select both a named provider and its upstream model. Any configured provider
# can also be selected dynamically as provider/model without declaring an alias.
# Deterministic routes, evaluated in order before any triage request. The
# first rule whose conditions all hold wins, and a rule with no conditions
# matches everything, so a catch-all belongs last. Rules exist because triage
# costs a full extra model round-trip on requests whose destination was never
# in question; a matched rule skips it entirely and is recorded in the decision
# audit under its name. Sensitive screening is never skipped: when
# interceptor.reject_sensitive is on, rules are not consulted until the prompt
# has been classified.
#
# route is "PASS" for normal provider routing, an [integrated.targets.*] name,
# or provider/model.
#
# [[routing_rules]]
# name = "small no-tool work stays on the default provider"
# max_input_tokens = 800
# has_tools = false
# route = "PASS"
#
# [[routing_rules]]
# name = "long context needs the big model"
# min_input_tokens = 40000
# route = "DETERMINISTIC"
#
# [[routing_rules]]
# name = "explanations"
# contains_any = ["explain", "why does"]
# requested_model = "Auto"
# route = "triage/local-fast"

# Optional per-model rates in USD per one million tokens. Keys are "model" or
# "provider/model"; the namespaced key wins, because the same model served by
# two providers rarely costs the same. Models with no entry are reported as
# unpriced rather than counted as free. baseline_model answers "what would this
# traffic have cost otherwise", which is the number local routing exists to
# move.
# [pricing]
# baseline_model = "openai/gpt-4o"
#
# [pricing.models."openai/gpt-4o"]
# input_per_mtok = 2.50
# output_per_mtok = 10.00
#
# [pricing.models."local-fast"]
# input_per_mtok = 0.0
# output_per_mtok = 0.0

[model_aliases]
# codex-qwen = "Qwen/Qwen2.5-Coder-32B-Instruct"
# claude-sonnet = "Qwen/Qwen2.5-Coder-32B-Instruct"
# Embeddings have no special provider type; expose any embedding model as an
# ordinary alias routed to whichever provider serves it.
# embedding = { provider = "default", model = "Qwen/Qwen3-Embedding-0.6B" }

[role_map]
# Qwen/vLLM chat templates often reject Codex/OpenAI's newer roles.
developer = "system"
function = "user"
tool = "user"

[chat]
# For Qwen thinking models, inject chat_template_kwargs.enable_thinking=false
# so OpenAI-compatible clients receive normal message.content instead of a
# vLLM reasoning field with null content.
disable_thinking = false

[responses]
mode = "chat_completions"

[models]
expose_aliases = true
expose_upstream = true
# cache_ttl_secs = 300 # optional; unset caches /v1/models indefinitely, 0 disables

# Sharing: limit this node's on-prem model and share work with other llmproxy
# nodes over a VPN. Pair from the admin Sharing page (copy your code, paste
# theirs); the keys below are what that page writes.
#
# [listen_guard]
# # Clients allowed on listen_addr. Loopback is always allowed; [] allows all.
# allowed_sources = ["192.168.0.0/16", "127.0.0.1"]
#
# An old [cluster] table still loads; the admin rewrites it as [sharing] on save.
# [sharing]
# mode = "peers"                     # "local" (default) or "peers"
# node_name = "home"                 # defaults to the host name
# peer_listen = "0.0.0.0:4040"       # default; opens with the first enabled peer
# advertise_url = "http://10.8.0.1:4040"  # the address shown to peers when they reach another one
# onprem_provider = "default"        # defaults to default_provider
# local_limit = 6                    # 0 (default) = no limit
# send_outgoing = true               # to peers when full or down
# accept_incoming = true
# incoming_limit = 2
# queue_depth = 8                    # 0 rejects immediately when full
# queue_wait_ms = 1000
# retry_after_secs = 2
# cloud_overflow = "openai/gpt-5.5"  # when full; unset = off
# cloud_overflow_modes = { proxy = true, intercept = true, integrated = true }
#
# [peers.office]
# url = "http://10.8.0.2:4040"
# public_key = "ed25519:..."
# send_outgoing = true
# accept_incoming = true
