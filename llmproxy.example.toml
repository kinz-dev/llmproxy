listen_addr = "127.0.0.1:8080"
routing_mode = "integrated" # proxy | intercept | integrated
# Timestamped trace logs are written under ~/.llmproxy. Set 0 to retain them indefinitely.
max_logging_retention_days = 7

# Optional loopback-only admin web interface (monitoring + runtime config
# editing). Disabled unless enable = true. Omitting listen_address binds
# 127.0.0.1 with a random port, printed at startup. The UI is served from the
# ui/ directory next to the binary: debug builds re-read files per request,
# release builds read them once at startup and cache until restart.
[admin]
enable = false
# listen_address = "127.0.0.1:11180"

[providers.default]
kind = "openai-compatible"
base_url = "http://127.0.0.1:8000/v1"
# api_key_env = "VLLM_API_KEY"
# Force the outbound value after routing. "high" is the portable choice;
# use "max" only when every model routed here supports it.
# reasoning_effort = "high"
timeout_secs = 600
connect_timeout_secs = 10
pool_max_idle_per_host = 64
pool_idle_timeout_secs = 90

# Optional agent interceptor. The triage provider receives a dynamic
# Chat Completions copy of /chat/completions, /responses, or /messages requests.
# It directly completes deterministic work above the built-in 80% likelihood
# threshold; a sole PASS function call sends the untouched original request
# through the existing provider/model remapping.
[providers.triage]
kind = "openai-compatible"
base_url = "http://127.0.0.1:11434/v1"
# api_key_env = "LOCAL_LLM_API_KEY"
timeout_secs = 30
connect_timeout_secs = 2
pool_max_idle_per_host = 16
pool_idle_timeout_secs = 90

[interceptor]
provider = "triage"
model = "qwen3:4b"
timeout_ms = 60000
fallback_on_error = true
# Optional fail-closed screening before provider execution or routing. The
# triage provider must be loopback/private-network because it sees the prompt
# before deciding REJECT at the built-in 75% likelihood threshold.
# The safe REJECT response never repeats the detected value. Proxy mode remains
# prompt-free and ignores this setting until the instance uses a triage mode.
reject_sensitive = false
# Sampling for the triage request. Completions that hit max_tokens fall back to
# normal provider routing instead of serving a clipped answer; max_tokens = 0
# leaves the client's own limits in place.
# temperature = 0.0
# max_tokens = 512
# parallel_tool_calls = false
# instructions = """Override the default triage instructions here."""
# Launchers inherit the one instance routing_mode:
# llmproxy --config llmproxy.example.toml --codex
# llmproxy --config llmproxy.example.toml --claude
# llmproxy --config llmproxy.example.toml --copilot

# Provider kinds select the upstream wire protocol and authentication shape.
# Cross-provider routes require an explicit proxy-owned API credential, OR a
# borrowed CLI login via auth = "codex-oauth"/"claude-oauth" (see below). These
# examples stay commented so this file starts without contacting remote APIs.
# [providers.openai]
# kind = "openai"
# base_url = "https://api.openai.com/v1"
# api_key_env = "OPENAI_API_KEY"
# reasoning_effort = "high"
#
# [providers.anthropic]
# kind = "anthropic"
# base_url = "https://api.anthropic.com/v1"
# api_key_env = "ANTHROPIC_API_KEY"
# reasoning_effort = "high"
#
# [providers.copilot]
# kind = "copilot"
# base_url = "https://api.githubcopilot.com"
# api_key_env = "COPILOT_BACKEND_TOKEN"

# Borrowed subscription OAuth: instead of a proxy-owned API key, reuse the login
# the official CLI already wrote to disk. llmproxy reads the token, refreshes it
# against the vendor endpoint when near expiry, and writes the rotated token back
# so the CLI keeps working. No key, no per-token billing — it uses your plan.
#
# codex-oauth borrows ~/.codex/auth.json (run `codex login` first) and speaks the
# ChatGPT Codex Responses backend; base_url MUST be the Codex backend, not
# api.openai.com. claude-oauth borrows ~/.claude/.credentials.json and presents
# requests as Claude Code so the subscription token is accepted.
# [providers.codex_sub]
# kind = "openai"
# auth = "codex-oauth"
# base_url = "https://chatgpt.com/backend-api/codex"
# reasoning_effort = "high"
#
# [providers.claude_sub]
# kind = "anthropic"
# auth = "claude-oauth"
# base_url = "https://api.anthropic.com/v1"
# reasoning_effort = "high"

# Integrated mode routes model "Auto" through the target tools below. Any other
# model bypasses integrated triage. Unmatched model IDs stay unchanged on the
# default provider. Redirects are sticky per hashed conversation key for the
# configured TTL; no message or session text is kept.
[integrated]
sticky_ttl_secs = 1800
sticky_capacity = 1024
# instructions = """Override the integrated routing policy here; empty uses the built-in default."""
#
[integrated.targets.DETERMINISTIC]
provider = "default"
model = "Qwen/Qwen2.5-Coder-32B-Instruct"
hint = "routine deterministic execution when confidence is greater than 80%"

# [integrated.targets.backend]
# provider = "openai"
# model = "gpt-5.4"
# reasoning_effort = "max" # overrides the provider default for this target
# hint = "server-side and backend work, deep exploration and debugging, and everything else not claimed by another route (default route)"
#
# [integrated.targets.frontend]
# provider = "anthropic"
# model = "claude-sonnet-4-5"
# hint = "GUI and frontend work: interface design, visual investigation, and UI implementation"
#
# [integrated.targets.routine]
# provider = "copilot"
# model = "gpt-5.4"
# hint = "routine work assigned to the Copilot provider"

# Optional manual overrides. Without these, every incoming model is mapped to
# the first id returned by the default upstream /v1/models. Inline route tables
# select both a named provider and its upstream model. Any configured provider
# can also be selected dynamically as provider/model without declaring an alias.
[model_aliases]
# codex-qwen = "Qwen/Qwen2.5-Coder-32B-Instruct"
# claude-sonnet = "Qwen/Qwen2.5-Coder-32B-Instruct"
# Embeddings have no special provider type; expose any embedding model as an
# ordinary alias routed to whichever provider serves it.
# embedding = { provider = "default", model = "Qwen/Qwen3-Embedding-0.6B" }

[role_map]
# Qwen/vLLM chat templates often reject Codex/OpenAI's newer roles.
developer = "system"
function = "user"
tool = "user"

[chat]
# For Qwen thinking models, inject chat_template_kwargs.enable_thinking=false
# so OpenAI-compatible clients receive normal message.content instead of a
# vLLM reasoning field with null content.
disable_thinking = false

[responses]
mode = "chat_completions"

[models]
expose_aliases = true
expose_upstream = true
# cache_ttl_secs = 300 # optional; unset caches /v1/models indefinitely, 0 disables
